<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
$(function() {
    $('.btn-submit').on('click', function() {
        $('.error').hide();
        $('.success').hide();
        $.post('/reset-password-email', { email: $('#inputEmail').val() })
            .done(function() {
                $('.success').show().html('If that email exists, we sent a reset link.');
            })
            .fail(function() {
                $('.error').show().html('An error occurred.');
            });
        return false;
    });
});
</script>
<style>
body,html{height:100%;background:#dedede}
.card{max-width:350px;padding:40px;margin:50px auto;background:#F7F7F7;border-radius:2px}
.form-signin input{width:100%;margin-bottom:10px;height:44px;padding:8px}
.btn-submit{width:100%;background:#6891a2;color:white;padding:10px;border:none;cursor:pointer}
.error,.success{display:none;margin-top:5px}.error{color:red}.success{color:green}
</style>
<div class="card">
    <h2>Forgot Password</h2>
    <form class="form-signin">
        <input type="email" id="inputEmail" placeholder="Email address" required>
        <span class="error"></span>
        <span class="success"></span>
        <button type="button" class="btn-submit">Send reset link</button>
    </form>
    <a href="/login">Back to login</a>
</div>
</body>
</html>
