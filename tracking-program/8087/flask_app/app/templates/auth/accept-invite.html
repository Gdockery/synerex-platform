<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Accept Invite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
$(function() {
  $('button[type="submit"]').on('click', function() {
    $('.error').hide();
    if ($('#password').val() !== $('#confirm_password').val()) {
      $('.error').show().html('Passwords do not match'); return;
    }
    var token = $('#token').val();
    $.post('/api/account', { token: token, password: $('#password').val() })
      .done(function() { window.location = '/'; })
      .fail(function(err) {
        $('.error').show().html(err.responseJSON?.error || 'Error occurred');
      });
    return false;
  });
});
</script>
<div class="card" style="max-width:500px;margin:50px auto;padding:20px">
  <h3>Welcome, {{ full_name }}!</h3>
  <p>Choose a password for your account.</p>
  <p><strong>Email:</strong> {{ email }}</p>
  <input type="hidden" id="token" value="{{ token }}">
  <input type="password" id="password" placeholder="Password" required autocomplete="new-password">
  <input type="password" id="confirm_password" placeholder="Confirm password" required autocomplete="new-password">
  <span class="error" style="color:red;display:none"></span>
  <button type="submit">Continue</button>
</div>
</body>
</html>
