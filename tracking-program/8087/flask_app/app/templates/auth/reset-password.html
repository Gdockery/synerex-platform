<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Reset Password</title>
</head>
<body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
$(function() {
    $('.btn-submit').on('click', function() {
        $('.error').hide();
        $.post('/reset-password', {
            token: $('#inputToken').val(),
            password: $('#inputPassword').val()
        })
            .done(function() { window.location = '/'; })
            .fail(function(err) {
                var msg = (err.responseJSON && err.responseJSON.error) || 'An error occurred.';
                $('.error').show().html(msg);
            });
        return false;
    });
});
</script>
<style>
body,html{height:100%;background:#dedede}
.card{max-width:350px;padding:40px;margin:50px auto;background:#F7F7F7;border-radius:2px}
.form-signin input{width:100%;margin-bottom:10px;height:44px;padding:8px}
.btn-submit{width:100%;background:#6891a2;color:white;padding:10px;border:none;cursor:pointer}
.error{display:none;color:red;margin-top:5px}
</style>
<div class="card">
    <h2>Reset Password</h2>
    <form class="form-signin">
        <input type="hidden" id="inputToken" value="{{ token }}">
        <input type="password" id="inputPassword" placeholder="New password (min 7 chars)" required minlength="7" autocomplete="new-password">
        <span class="error"></span>
        <button type="button" class="btn-submit">Reset password</button>
    </form>
    <a href="/login">Back to login</a>
</div>
</body>
</html>
