<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if portal_title %}{{ portal_title }}{% else %}ECBS Intelligence Platform™{% endif %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }

    /* ── Two-column root ── */
    .lp-root {
      display: flex;
      min-height: 100vh;
      width: 100%;
      background: #060e1a;
    }

    /* ══ LEFT — spec graphic fills the panel ══ */
    .lp-left {
      flex: 0 0 58%;
      position: relative;
      overflow: hidden;
      min-height: 100vh;
    }
    .lp-left-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    /* ══ RIGHT — sign-in form ══ */
    .lp-right {
      flex: 0 0 42%;
      background: #080f1c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2.5rem;
      min-height: 100vh;
      overflow-y: auto;
    }

    .lp-form-wrap {
      width: 100%;
      max-width: 360px;
    }

    /* OEM logo */
    .lp-oem-block { text-align:center; margin-bottom:1.5rem; }
    .lp-oem-logo  { height:auto; max-height:52px; max-width:200px; object-fit:contain; }

    /* Synerex logo when no OEM */
    .lp-sys-logo  { display:block; height:34px; width:auto; margin:0 auto 1.5rem; filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5)); }

    .lp-form-header { margin-bottom:1.75rem; text-align:center; }
    .lp-form-header h2 {
      margin:0 0 0.4rem;
      font-size:1.55rem; font-weight:700;
      color:#fff; letter-spacing:-0.01em;
    }
    .lp-form-header p { margin:0; font-size:0.84rem; color:rgba(255,255,255,0.42); line-height:1.5; }

    /* Inputs */
    .lp-field { margin-bottom:0.9rem; }
    .lp-label { display:block; font-size:0.78rem; font-weight:500; color:rgba(255,255,255,0.55); margin-bottom:0.38rem; letter-spacing:0.03em; }
    .lp-input {
      display:block; width:100%; padding:0.78rem 1rem;
      background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.11);
      border-radius:10px; color:#fff; font-size:0.92rem; font-family:inherit;
      outline:none; transition:border-color .2s, box-shadow .2s;
    }
    .lp-input::placeholder { color:rgba(255,255,255,0.28); }
    .lp-input:focus { border-color:rgba(26,185,110,0.6); box-shadow:0 0 0 3px rgba(26,185,110,0.10); }

    /* Remember + Forgot row */
    .lp-meta-row { display:flex; align-items:center; justify-content:space-between; margin:.2rem 0 1.1rem; }
    .lp-remember { display:flex; align-items:center; gap:.45rem; cursor:pointer; }
    .lp-remember input[type="checkbox"] { width:14px; height:14px; accent-color:#1bc07a; cursor:pointer; }
    .lp-remember span { font-size:0.81rem; color:rgba(255,255,255,0.48); }
    .lp-forgot-link { font-size:0.81rem; color:rgba(26,195,115,0.8); text-decoration:none; transition:color .2s; }
    .lp-forgot-link:hover { color:#1bc07a; text-decoration:underline; }

    /* Error */
    .lp-error {
      display:none; color:#ff7070; font-size:0.82rem; text-align:center;
      margin-bottom:.75rem; padding:.6rem .75rem;
      background:rgba(255,70,70,0.08); border-radius:8px; border:1px solid rgba(255,70,70,0.18);
    }

    /* Sign In */
    .lp-btn-primary {
      display:block; width:100%; padding:.85rem;
      background:linear-gradient(135deg,#1bc07a,#158c58);
      color:#fff; font-size:0.95rem; font-weight:700; font-family:inherit;
      border:none; border-radius:10px; cursor:pointer; letter-spacing:.04em;
      transition:opacity .2s, transform .15s;
      box-shadow:0 4px 18px rgba(27,192,122,0.28);
    }
    .lp-btn-primary:hover  { opacity:.87; transform:translateY(-1px); }
    .lp-btn-primary:active { opacity:1; transform:translateY(0); }

    /* Divider */
    .lp-divider { display:flex; align-items:center; gap:.75rem; margin:1.1rem 0; }
    .lp-divider-line { flex:1; height:1px; background:rgba(255,255,255,0.09); }
    .lp-divider-text { font-size:0.75rem; color:rgba(255,255,255,0.3); white-space:nowrap; letter-spacing:.04em; }

    /* SSO */
    .lp-sso-row { display:flex; gap:.65rem; margin-bottom:1.2rem; }
    .lp-btn-sso {
      flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
      padding:.72rem .75rem;
      background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12);
      border-radius:10px; color:rgba(255,255,255,0.72);
      font-size:0.82rem; font-family:inherit; font-weight:500;
      cursor:pointer; text-decoration:none; transition:background .2s, border-color .2s;
    }
    .lp-btn-sso:hover { background:rgba(255,255,255,0.09); border-color:rgba(255,255,255,0.2); }
    .lp-btn-sso svg { width:16px; height:16px; flex-shrink:0; }

    /* Support + footer */
    .lp-support { text-align:center; margin-top:.5rem; }
    .lp-support a { font-size:0.8rem; color:rgba(255,255,255,0.3); text-decoration:none; transition:color .2s; }
    .lp-support a:hover { color:rgba(255,255,255,0.65); }
    .lp-right-footer { margin-top:2rem; text-align:center; font-size:0.68rem; color:rgba(255,255,255,0.2); line-height:1.7; }
    .lp-right-footer a { color:rgba(255,255,255,0.28); text-decoration:none; }
    .lp-right-footer a:hover { color:rgba(255,255,255,0.55); text-decoration:underline; }

    /* OEM color override */
    {% if oem_primary_color %}
    .lp-btn-primary { background:linear-gradient(135deg,{{ oem_primary_color }},{{ oem_primary_color }}cc) !important; box-shadow:0 4px 18px {{ oem_primary_color }}44 !important; }
    .lp-input:focus  { border-color:{{ oem_primary_color }}99 !important; box-shadow:0 0 0 3px {{ oem_primary_color }}20 !important; }
    {% endif %}

    /* ── Responsive ── */
    @media (max-width: 860px) {
      .lp-root  { flex-direction:column; }
      .lp-left  { flex:none; min-height:0; height:260px; }
      .lp-right { flex:none; min-height:0; justify-content:flex-start; padding:2rem 1.5rem; }
    }
    @media (max-width: 480px) {
      .lp-right { padding:1.5rem 1rem; }
      .lp-sso-row { flex-direction:column; }
    }
  </style>
</head>
<body>
<script src="scripts/jquery-3.7.1.min.js"></script>
<script>
$(function() {
  var base = (location.pathname.match(/^(.+)\/login/) || ['',''])[1] || '';
  var waiting = false;
  $('form[data-purpose="login"]').on('submit', function() {
    if (waiting) return false;
    waiting = true;
    $('.lp-error').hide();
    $.post(base + '/login', {
      email: $('#lpEmail').val(),
      password: $('#lpPassword').val(),
      terms: 'accept'
    })
    .done(function() { window.location = base + '/'; })
    .fail(function(err) {
      waiting = false;
      var msg = (err.responseJSON && err.responseJSON.error) || '';
      if (msg)                   { $('.lp-error').show().html(msg); }
      else if (err.status===404) { $('.lp-error').show().html('Unrecognized email address or password.'); }
      else if (err.status===400) { $('.lp-error').show().html('Please enter your email address and password.'); }
      else                       { $('.lp-error').show().html('An unexpected error occurred. Please try again.'); }
    });
    return false;
  });
  if (location.href.match('expired'))          { $('.lp-error').show().html('Session expired. Please sign in again.'); }
  if (location.href.match('error=terms'))      { $('.lp-error').show().html('Please accept the Terms &amp; Conditions to sign in.'); }
  if (location.href.match('error=seat_limit')) { $('.lp-error').show().html('Seat limit reached. Please contact your administrator.'); }
  if (location.href.match('error=license_expired')) {
    var licenseUrl = window.location.origin + '/license/register/renew';
    $('.lp-error').show().html('Your subscription has expired. <a href="' + licenseUrl + '" style="color:#7c3aed;font-weight:700;">Renew &rarr;</a>');
  }
  var params = new URLSearchParams(location.search);
  if (params.get('email')) {
    $('#lpEmail').val(decodeURIComponent(params.get('email')));
    $('#lpReauthNote').text('Please re-enter your password for ' + decodeURIComponent(params.get('email')));
  }
});
</script>

<div class="lp-root">

  <!-- LEFT: spec marketing graphic -->
  <div class="lp-left">
    <img class="lp-left-img" src="images/ecbs-login-panel.png" alt="ECBS Intelligence Platform">
  </div>

  <!-- RIGHT: sign-in form -->
  <div class="lp-right">
    <div class="lp-form-wrap">

      {% if oem_logo_url %}
      <div class="lp-oem-block">
        <img src="{{ oem_logo_url }}" alt="Logo" class="lp-oem-logo">
      </div>
      {% else %}
      <img src="images/synerex_logo_white.png" alt="Synerex" class="lp-sys-logo">
      {% endif %}

      <div class="lp-form-header">
        <h2>Welcome Back</h2>
        <p id="lpReauthNote">Sign in to access the ECBS Intelligence Platform™</p>
      </div>

      <form data-purpose="login" autocomplete="off">
        <div class="lp-field">
          <label class="lp-label" for="lpEmail">Email Address</label>
          <input type="email" id="lpEmail" class="lp-input" placeholder="Enter your email address" required autofocus autocomplete="off">
        </div>
        <div class="lp-field">
          <label class="lp-label" for="lpPassword">Password</label>
          <input type="password" id="lpPassword" class="lp-input" placeholder="Enter your password" required autocomplete="new-password">
        </div>

        <div class="lp-meta-row">
          <label class="lp-remember">
            <input type="checkbox" id="lpRemember" name="remember" checked>
            <span>Remember me</span>
          </label>
          <a class="lp-forgot-link" href="forgot-password">Forgot Password?</a>
        </div>

        <div class="lp-error"></div>

        <button type="submit" class="lp-btn-primary">Sign In</button>
      </form>

      <div class="lp-divider">
        <div class="lp-divider-line"></div>
        <div class="lp-divider-text">or continue with</div>
        <div class="lp-divider-line"></div>
      </div>

      <div class="lp-sso-row">
        <a class="lp-btn-sso" href="#" onclick="return false;" title="Microsoft SSO — contact your administrator to configure">
          <svg viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
            <rect x="1"  y="1"  width="9" height="9" fill="#f25022"/>
            <rect x="11" y="1"  width="9" height="9" fill="#7fba00"/>
            <rect x="1"  y="11" width="9" height="9" fill="#00a4ef"/>
            <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
          </svg>
          Microsoft
        </a>
        <a class="lp-btn-sso" href="#" onclick="return false;" title="Google SSO — contact your administrator to configure">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Google
        </a>
      </div>

      <div class="lp-support">
        <a href="mailto:support@synerexlabs.com">Need help? Contact Support</a>
      </div>

      <div class="lp-right-footer">
        &copy; 2025 Synerex Laboratories LLC. All rights reserved.<br>
        <a href="terms">Privacy Policy</a> &nbsp;|&nbsp; <a href="terms">Terms of Service</a> &nbsp;|&nbsp; Version 4.0.0
      </div>
    </div>
  </div>

</div>
</body>
</html>
