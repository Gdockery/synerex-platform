<!-- ECBS OS™ Digital Twin — Spec SS-5 / Figure A-5 — One-line diagram + live overlays -->
<div class="ecbs-page">

  <div class="ecbs-page-header">
    <div class="page-title-block">
      <h1>Digital Twin</h1>
      <p>Visual engineering source of truth — one-line diagram with live electrical overlays.</p>
    </div>
    <div class="page-actions">
      <button class="btn-ecbs btn-outline"><span class="fa fa-expand"></span> Fullscreen</button>
      <button class="btn-ecbs btn-outline"><span class="fa fa-download"></span> Export PDF</button>
    </div>
  </div>

  <div class="dt-layout">

    <!-- One-line diagram canvas — spec SS-5 main area -->
    <div class="ecbs-card dt-canvas-card">
      <div class="ecbs-card-title"><span class="fa fa-share-alt"></span> One-Line Diagram</div>
      <div class="dt-canvas">

        <div *ngIf="loading" style="height:100%;display:flex;align-items:center;justify-content:center;color:#546e7a;">
          <span class="fa fa-spinner fa-spin" style="font-size:24px;"></span>
        </div>

        <!-- SVG one-line diagram — dynamic from assets -->
        <svg *ngIf="!loading" class="dt-svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet">
          <!-- Grid lines -->
          <defs>
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2d45" stroke-width="0.5"/>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#grid)"/>

          <!-- Utility feed line -->
          <line x1="80" y1="60" x2="80" y2="120" stroke="#29b6f6" stroke-width="2.5"/>
          <!-- Utility symbol -->
          <circle cx="80" cy="48" r="14" fill="none" stroke="#29b6f6" stroke-width="2"/>
          <text x="80" y="53" text-anchor="middle" fill="#29b6f6" font-size="11" font-weight="700">U</text>
          <text x="80" y="38" text-anchor="middle" fill="#8899a6" font-size="10">Utility Feed</text>

          <!-- Main breaker -->
          <rect x="68" y="120" width="24" height="16" rx="3" fill="#1e2d45" stroke="#29b6f6" stroke-width="1.5"/>
          <text x="80" y="131" text-anchor="middle" fill="#29b6f6" font-size="9">CB</text>
          <line x1="80" y1="136" x2="80" y2="180" stroke="#29b6f6" stroke-width="2.5"/>

          <!-- Main bus bar -->
          <rect x="40" y="180" width="720" height="8" rx="2" fill="#29b6f6" opacity="0.7"/>
          <text x="400" y="175" text-anchor="middle" fill="#29b6f6" font-size="11" font-weight="600">480V Main Bus</text>

          <!-- Transformer branches — dynamic from assets -->
          <ng-container *ngFor="let a of assets; let i = index">
            <g [attr.transform]="'translate(' + (100 + i * 160) + ', 188)'">
              <!-- Drop line -->
              <line x1="0" y1="0" x2="0" y2="40" [attr.stroke]="barColor(a.utilization_pct||0)" stroke-width="2"/>
              <!-- Breaker -->
              <rect x="-10" y="40" width="20" height="14" rx="2" fill="#111927" [attr.stroke]="barColor(a.utilization_pct||0)" stroke-width="1.5"/>
              <text x="0" y="51" text-anchor="middle" fill="#8899a6" font-size="8">CB</text>
              <!-- Transformer symbol -->
              <line x1="0" y1="54" x2="0" y2="70" [attr.stroke]="barColor(a.utilization_pct||0)" stroke-width="2"/>
              <circle cx="0" cy="78" r="12" fill="#111927" [attr.stroke]="barColor(a.utilization_pct||0)" stroke-width="2"/>
              <circle cx="0" cy="92" r="12" fill="#111927" [attr.stroke]="barColor(a.utilization_pct||0)" stroke-width="2"/>
              <!-- Drop to load -->
              <line x1="0" y1="104" x2="0" y2="130" [attr.stroke]="barColor(a.utilization_pct||0)" stroke-width="2"/>
              <!-- Load box -->
              <rect x="-40" y="130" width="80" height="36" rx="4" fill="#111927" [attr.stroke]="barColor(a.utilization_pct||0)" stroke-width="1.5"/>
              <!-- Name -->
              <text x="0" y="146" text-anchor="middle" fill="#e8edf5" font-size="9" font-weight="600">{{ a.name || 'T' + (i+1) }}</text>
              <!-- KVA label -->
              <text x="0" y="159" text-anchor="middle" [attr.fill]="barColor(a.utilization_pct||0)" font-size="8">{{ (a.utilization_pct||0) | number:'1.0-0' }}%</text>
              <!-- Status dot -->
              <circle cx="36" cy="134" r="5" [attr.fill]="barColor(a.utilization_pct||0)" opacity="0.9"/>
            </g>
          </ng-container>

          <!-- No assets placeholder -->
          <g *ngIf="assets.length === 0">
            <text x="400" y="320" text-anchor="middle" fill="#546e7a" font-size="14">Configure transformers in Devices to render the one-line diagram</text>
          </g>

          <!-- Legend -->
          <g transform="translate(20, 460)">
            <circle cx="10" cy="10" r="5" fill="#00e676"/><text x="20" y="14" fill="#8899a6" font-size="10">Normal (&lt;75%)</text>
            <circle cx="120" cy="10" r="5" fill="#ffd740"/><text x="130" y="14" fill="#8899a6" font-size="10">Warning (75–90%)</text>
            <circle cx="250" cy="10" r="5" fill="#f44336"/><text x="260" y="14" fill="#8899a6" font-size="10">Critical (&gt;90%)</text>
          </g>
        </svg>

      </div>
    </div>

    <!-- Right sidebar: live data -->
    <div class="dt-sidebar">

      <!-- CBI card -->
      <div class="ecbs-card dt-cbi-card">
        <div class="ecbs-card-title"><span class="fa fa-tachometer"></span> CBI Score</div>
        <div class="dt-cbi-score" [style.color]="cbiScore >= 90 ? '#00e676' : cbiScore >= 75 ? '#ffd740' : '#f44336'">{{ cbiScore | number:'1.0-0' }}</div>
        <div style="font-size:11px;color:#8899a6;text-align:center;">Target: 90+</div>
        <a class="btn-ecbs btn-outline" style="font-size:11px;margin-top:8px;width:100%;text-align:center;" routerLink="/ecbs/current-analysis">View Details</a>
      </div>

      <!-- Transformer status list -->
      <div class="ecbs-card">
        <div class="ecbs-card-title"><span class="fa fa-plug"></span> Live Status</div>
        <div *ngIf="assets.length === 0" style="font-size:11px;color:#546e7a;padding:8px 0;">No assets configured.</div>
        <div class="dt-status-row" *ngFor="let a of assets">
          <div class="dt-status-dot" [style.background]="barColor(a.utilization_pct||0)"></div>
          <div class="dt-status-name">{{ a.name || a.asset_id }}</div>
          <span [style.color]="barColor(a.utilization_pct||0)" style="font-size:11px;font-weight:700;">{{ (a.utilization_pct||0) | number:'1.0-0' }}%</span>
        </div>
      </div>

    </div>

  </div>

</div>
