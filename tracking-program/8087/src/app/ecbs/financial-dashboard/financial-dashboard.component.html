<div class="ecbs-page fin-dashboard">
  <div class="ecbs-page-header">
    <div class="page-title-block">
      <h1>Financial Dashboard</h1>
      <p>Unified view of revenue, margin, payments, and ECBS savings performance.</p>
    </div>
    <div class="header-actions">
      <button class="btn-ecbs btn-outline"><span class="fa fa-download"></span> Export Report</button>
      <button class="btn-ecbs btn-primary"><span class="fa fa-refresh"></span> Refresh</button>
    </div>
  </div>
  <div class="fin-kpi-row">
    <div class="fin-kpi-card" *ngFor="let k of kpis">
      <div class="fin-kpi-icon" [style.background]="k.color + '22'">
        <span class="fa" [ngClass]="k.icon" [style.color]="k.color"></span>
      </div>
      <div class="fin-kpi-body">
        <div class="fin-kpi-label">{{ k.label }}</div>
        <div class="fin-kpi-value">{{ k.value }}</div>
        <div class="fin-kpi-change" [class.up]="k.dir==='up'" [class.down]="k.dir==='down'">
          <span class="fa" [class.fa-arrow-up]="k.dir==='up'" [class.fa-arrow-down]="k.dir==='down'"></span>
          {{ k.change }} vs Last Month
        </div>
      </div>
    </div>
  </div>
  <div class="fin-section-title">FINANCIAL MODULES</div>
  <div class="fin-links-grid">
    <div class="fin-link-card" *ngFor="let l of quickLinks" (click)="navigate(l.route)">
      <div class="fin-link-icon"><span class="fa" [ngClass]="l.icon"></span></div>
      <div class="fin-link-label">{{ l.label }}</div>
      <div class="fin-link-desc">{{ l.desc }}</div>
      <span class="fa fa-arrow-right fin-link-arrow"></span>
    </div>
  </div>
  <div class="fin-section-title" style="margin-top:24px;">RECENT ACTIVITY</div>
  <div class="ecbs-card" style="padding:0;overflow:hidden;">
    <div class="fin-activity-row" *ngFor="let a of recentActivity">
      <span class="fa fin-act-icon"
        [class.fa-credit-card]="a.type==='payment'"
        [class.fa-file-text-o]="a.type==='invoice'"
        [class.fa-bell-o]="a.type==='alert'"
        [style.color]="a.type==='payment'?'#00e676':a.type==='invoice'?'#29b6f6':'#ffd740'"></span>
      <div class="fin-act-body">
        <div class="fin-act-label">{{ a.label }}</div>
        <div class="fin-act-date">{{ a.date }}</div>
      </div>
      <div class="fin-act-amount">{{ a.amount }}</div>
      <span class="fin-badge" [style.color]="a.badgeColor" [style.border-color]="a.badgeColor">{{ a.badge }}</span>
    </div>
  </div>
</div>
