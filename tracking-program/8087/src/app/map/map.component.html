<div style="position: relative; height: calc(100vh - 100px); width: 100%;">

  <div id="map-container" style="height: 100%; width: 100%; overflow: hidden;"></div>

  <!-- Directions bar — shown once geocoding resolves -->
  <div *ngIf="directionsUrl"
       style="position: absolute; bottom: 0; left: 0; right: 0;
              background: rgba(20,24,35,0.92); color: #fff;
              display: flex; align-items: center; justify-content: space-between;
              padding: 10px 18px; font-family: sans-serif; font-size: 14px;
              box-shadow: 0 -2px 8px rgba(0,0,0,0.4); z-index: 100;">
    <span style="display: flex; align-items: center; gap: 8px;">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
           fill="none" stroke="#e05c5c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
      </svg>
      <strong>{{ projectName }}</strong>
      <span style="color:#aaa;">— {{ projectAddress }}</span>
    </span>
    <a [href]="directionsUrl" target="_blank" rel="noopener"
       style="background:#e05c5c; color:#fff; text-decoration:none;
              padding: 6px 14px; border-radius: 4px; font-weight: 600;
              white-space: nowrap; margin-left: 16px;">
      Get Directions ↗
    </a>
  </div>

</div>
