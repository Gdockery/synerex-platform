<div class="content-box">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-12">
        <h3>New Repeater</h3>
      </div>
    </div>

    <hr/>

    <form [formGroup]="form" (ngSubmit)="submitCreateRepeaterForm()">
      <div class="row">
        <div class="col-md-12">
          <div class="form-group">
            <label class="with-description" for="name">Nickname: <small class="text-muted pull-right">Custom label used to indicate the location of the repeater in a facility.</small></label>
            <input type="text" class="form-control" id="name" name="name" formControlName="name" placeholder="e.g. BLDG3-C1-R6">
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-12">
          <div class="form-group">
            <label class="with-description" for="deviceId">Load Controller Serial#: <small class="text-muted pull-right">The serial number (from outside of box) of the load controller being used as a repeater.</small></label>
            <input type="text" class="form-control" id="deviceId" name="deviceId" formControlName="deviceId" placeholder="e.g. B8:27:EB:7B:06:67">
            <div *ngIf="form.controls.deviceId.errors && (form.controls.deviceId.dirty || form.controls.deviceId.touched)" class="alert alert-danger">
              Serial number must be correct format e.g. B8:27:EB:7B:06:67
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-12 text-right">
          <a class="btn btn-default cancel-btn" [routerLink]="['/repeaters/devices']">Cancel</a>
          <button type="submit" class="btn btn-primary">
            <span [hidden]="syncing">Save</span>
            <span [hidden]="!syncing">Saving...</span>
          </button>
        </div>
      </div>
      <div class="row"></div>
    </form>
  </div>
</div>
