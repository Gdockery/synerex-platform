<ng-progress id="progressIndicator" [color]="'#00e676'"></ng-progress>

<ng-sidebar-container [animate]="false" style="height: 100vh; display: block;">

  <ng-sidebar
    [(opened)]="_opened"
    [mode]="'push'"
    [dock]="true"
    [dockedSize]="'50px'"
    [animate]="false">
    <sd-navbar (notify)='_toggleSidebar()'></sd-navbar>
  </ng-sidebar>

  <div class="page-content" ng-sidebar-content>
    <sd-toolbar></sd-toolbar>
    <div class="ecbs-page-body">
      <router-outlet></router-outlet>
    </div>
  </div>

</ng-sidebar-container>

<div class="clearfix"></div>

<p-confirmDialog icon="fa fa-question-circle" width="425"></p-confirmDialog>

<footer class="ecbs-footer">
  <span class="ecbs-footer-copy">
    © 2026 Synerex Laboratories, LLC. All Rights Reserved.
    uBillTRACKER and uBill4CAST are Trademarks of Synerex Laboratories, LLC.
  </span>
  <span class="ecbs-footer-links">
    <a href="#">Privacy Policy</a>
    <a href="#">Terms of Service</a>
    <a href="#">Support</a>
  </span>
  <span class="ecbs-footer-live">
    <span class="live-dot-sm"></span>
    Data updated: {{ lastUpdated }}
  </span>
</footer>

<style>
/* ── ECBS App Shell Global Overrides ──────────────────────────────────────── */

/* Dark page background — matches spec SS-2 through SS-25 */
body, html {
  background: #0a0f1a !important;
  color: #e8edf5;
}

.page-content {
  background: #0a0f1a;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.ecbs-page-body {
  flex: 1;
  padding: 0;
  background: #0a0f1a;
  /* Bottom padding to clear the fixed footer */
  padding-bottom: 36px;
}

/* ── ECBS Footer ─────────────────────────────────────────────────────────── */
.ecbs-footer {
  background: #0d1525;
  border-top: 1px solid #1e2d45;
  height: 34px;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 90;
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 20px;
  font-family: "Inter", system-ui, sans-serif;
}

.ecbs-footer-copy {
  font-size: 9px;
  color: #546e7a;
  flex: 1;
}

.ecbs-footer-links {
  display: flex;
  gap: 12px;
  a {
    font-size: 10px;
    color: #546e7a;
    text-decoration: none;
    &:hover { color: #8899a6; }
  }
}

.ecbs-footer-live {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  color: #546e7a;
  white-space: nowrap;
}

.live-dot-sm {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #00e676;
  box-shadow: 0 0 5px #00e676;
}

/* ── ng-sidebar container fix ────────────────────────────────────────────── */
ng-sidebar-container {
  display: flex !important;
  flex-direction: row;
  flex: 1;
}
</style>
