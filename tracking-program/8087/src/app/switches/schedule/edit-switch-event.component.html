<div class="container-fluid" *ngIf="event">
  <div class="row">
    <div class="col-md-6">
      <h3 style="margin-top:0;">
        <a *ngIf="switchType=='circuits'" style="color:black;" [routerLink]="['/switches/schedule/list']" class="ss-navigateleft"></a>
        <span [ngClass]="{green: event.command=='Turn On',red: event.command=='Turn Off',cancelled:cancelled}">{{event.command}}</span>
        <span [ngClass]="{cancelled:cancelled}">{{event.switchCount}} switches on {{(event.startAt | projectTzMoment) | amDateFormat:"ddd, MMM D YYYY [at] h:mm:ss A z"}}</span>
      </h3>
    </div>
    <div class="col-xs-6 text-right">
      <button class="default-button red-button" (click)="confirmCancel()" *ngIf="!cancelled">Cancel Event</button>
      <button class="default-button white-button" disabled="disabled" (click)="cancelEvent()" *ngIf="cancelled">Cancelled</button>
    </div>
  </div>
  <div class="row">
    <div class="col-xs-12" [ngClass]="{cancelled:cancelled}">
      <p-dataTable tableStyleClass="table dataTable table-striped table-bordered" [value]="event.switches">
        <p-column field="name" header="Nickname"></p-column>
        <p-column field="status" header="Status">
          <ng-template let-col let-row="rowData" pTemplate="body">
            <span [ngClass]="{'pending':row.status=='pending','canceled':row.status=='canceled','accepted':row.status=='accepted'}">{{row.status}}</span>
          </ng-template>
        </p-column>
      </p-dataTable>
    </div>
  </div>
</div>
