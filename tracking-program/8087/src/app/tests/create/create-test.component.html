<div class="content-box">
  <form [formGroup]="testForm">
    <div class="container-fluid">
      <div class="col-md-12">
        <div class="row">
          <div class="col-md-12">
            <div class="pull-right">
              <button type="button" class="default-button green-button" (click)="submit()">Submit</button>
            </div>
          </div>
        </div>
        <div class="row" style="margin-top:20px;">
          <div class="col-md-3" style="padding-top:10px;">
            <div class="form-group">
              <label for="startAt">Date</label>
              <my-date-picker
                name="startAt"
                id="startAt"
                [options]="datePickerOptions"
                formControlName="startAt">
              </my-date-picker>
              <div *ngIf="testForm.controls.startAt.errors && (testForm.controls.startAt.dirty || testForm.controls.startAt.touched)" class="alert alert-danger">
                A date must be provided.
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <timepicker #timePicker formControlName="time" [minuteStep]="15"></timepicker>
            <div *ngIf="this.timePicker.invalidHours || this.timePicker.invalidMinutes" class="alert alert-danger">
              A start time must be provided.
            </div>
          </div>
          <div class="col-md-3" style="padding-top:10px;">
            <div class="form-group">
              <label for="duration">Interval (In hours)</label>
              <input type="text" class="form-control" id="interval" name="interval" formControlName="interval">
              <div *ngIf="testForm.controls.interval.hasError('required') && (testForm.controls.interval.dirty || testForm.controls.interval.touched)" class="alert alert-danger">
                A numeric for interval must be provided.
              </div>
            </div>
            <div class="form-group">
              <label for="duration">Duration (In hours)</label>
              <input type="text" class="form-control" id="duration" name="duration" formControlName="duration">
              <div *ngIf="testForm.controls.duration.hasError('required') && (testForm.controls.duration.dirty || testForm.controls.duration.touched)" class="alert alert-danger">
                A numeric for duration must be provided.
              </div>
              <div *ngIf="testForm.controls.duration.hasError('invalidDivisibleBy') && (testForm.controls.duration.dirty || testForm.controls.duration.touched)" class="alert alert-danger">
                Duration must be a multiple of interval.
              </div>
            </div>
          </div>
        </div>

        <div [hidden]="availableGateways.length === 0 || !gwControl">
          <hr/>
          <div class="row">
            <div class="col-md-2"><strong>Gateways:</strong></div>
          </div>

          <div class="row">
            <div *ngFor="let gateway of availableGateways" class="col-md-3 checkbox-column">
              <input type="checkbox" [id]="'gateway_'+gateway.id" (change)="addOrRemoveGateway(gateway.id)">
              &nbsp;&nbsp;{{gateway.name}}
            </div>
          </div>

        </div>
      </div>
    </div>
  </form>
</div>
