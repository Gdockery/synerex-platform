server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: serve index.html for client-side routes (e.g. /admin)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Explicit fallback for /admin in case try_files is not applied
    location = /admin {
        try_files /index.html =404;
    }

    location /videos/ {
        resolver 8.8.8.8 valid=10s;
        set $gpu_upstream http://192.168.1.14:8300;
        proxy_pass $gpu_upstream$request_uri;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        add_header Cache-Control "public, max-age=604800";
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
