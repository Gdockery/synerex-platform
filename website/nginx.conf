server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: serve index.html for client-side routes (e.g. /admin)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Explicit fallback for /admin in case try_files is not applied
    location = /admin {
        try_files /index.html =404;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
