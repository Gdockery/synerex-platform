server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS — needed for upstreams resolved at request time
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── API proxy locations ────────────────────────────────────────────────────
    # Use $request_uri (full original path) with the static 'proxy' upstream.
    # This avoids the nginx variable+path URI-doubling bug.

    location /license/ {
        proxy_pass         http://proxy$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /tracking/ {
        proxy_pass         http://proxy$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /emv/ {
        proxy_pass         http://proxy$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # service-manager runs on port 9000 and is NOT routed through the main proxy.
    # Strip /service-manager/ prefix before forwarding, resolve lazily via Docker DNS.
    location /service-manager/ {
        rewrite ^/service-manager/(.*) /$1 break;
        set $svc service-manager;
        proxy_pass         http://$svc:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Static video proxy ─────────────────────────────────────────────────────
    location /videos/ {
        resolver 8.8.8.8 valid=10s;
        set $gpu_upstream http://192.168.1.14:8300;
        proxy_pass $gpu_upstream$request_uri;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        add_header Cache-Control "public, max-age=604800";
    }

    # ── Health check ───────────────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ── Explicit fallback for /admin ───────────────────────────────────────────
    location = /admin {
        try_files /index.html =404;
    }

    # ── SPA catch-all ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
