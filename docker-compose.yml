version: "3.9"

services:
  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      website:
        condition: service_healthy
      website-backend:
        condition: service_healthy
      license-service:
        condition: service_healthy
      emv-program:
        condition: service_healthy
      tracking-program:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
  license-service:
    build:
      context: ./license-service/services/license-service
    env_file:
      - ./license-service/services/license-service/.env
    environment:
      TRACKING_PROGRAM_URL: http://tracking-program:8087
      REDIS_URL: redis://redis:6379/0
      ADMIN_RESTART_SECRET: ${ADMIN_RESTART_SECRET:-synerex-admin-restart-secret}
      RESTART_VIA_EXIT: "1"
    volumes:
      - ./license-service/templates:/app/templates:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
  emv-program:
    build:
      context: ./emv-program/8082
    depends_on:
      mysql-emv:
        condition: service_healthy
    env_file:
      - ./emv-program/8082/.env
    environment:
      EMV_BASE_URL: http://100.91.109.59:8080/emv
      EMV_DB_HOST: mysql-emv
      EMV_DB_PORT: "3306"
      TRACKING_PROGRAM_URL: http://tracking-program:8087
      TRACKING_URL: http://tracking-program:8087
      EMV_API_KEY: ${EMV_API_KEY:-tracking-push-secret}
      WEATHER_SERVICE_URL: http://host.docker.internal:8200
      HTML_REPORT_URL: http://html-report-service:8084
      ADMIN_RESTART_SECRET: ${ADMIN_RESTART_SECRET:-synerex-admin-restart-secret}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./emv-program/8082:/app
      - ./emv-program/8084:/app/8084
    ports:
      - "8082:8082"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
  html-report-service:
    image: python:3.11-slim
    working_dir: /app
    env_file:
      - ./emv-program/8082/.env
    environment:
      EMV_BASE_URL: http://emv-program:8082
      EMV_APP_URL: http://emv-program:8082
    volumes:
      - ./emv-program/8082:/app
      - ./emv-program/8084:/app/8084
    command: >
      sh -c "pip install --no-cache-dir flask flask-cors requests &&
             cd /app/8084 && python html_report_service.py"
    ports:
      - "8084:8084"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8084/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 5

  service-manager:
    image: python:3.11-slim
    working_dir: /app
    network_mode: "host"
    pid: "host"
    cap_add:
      - SYS_PTRACE
      - DAC_READ_SEARCH
    env_file:
      - ./emv-program/8082/.env
    environment:
      CHROMA_URL: http://localhost:8100
      OLLAMA_EMBED_MODEL: nomic-embed-text
    volumes:
      - ./emv-program:/app
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      sh -c "pip install --no-cache-dir -r /app/8082/requirements.txt &&
             apt-get update -qq && apt-get install -y -qq docker.io &&
             (python /app/8082/ollama_ai_backend.py &) &&
             python -u /app/service_manager_daemon.py"
    restart: unless-stopped
  tracking-program:
    image: synerex-platform_tracking:latest
    build:
      context: ./tracking-program
      dockerfile: 8087/flask_app/Dockerfile
    env_file:
      - ./tracking-program/8087/flask_app/.env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TRACKING_DB_URL: mysql://tracking_user:TrackingPass123@mysql-tracking:3306/tracking
      PDF_BRIDGE_PATH: /app/8087/scripts/pdf-bridge.js
      LICENSE_SERVICE_URL: http://license-service:8000
      LICENSE_SERVICE_PUBLIC_URL: http://100.91.109.59:8080/license
      TRACKING_BASE_URL: http://proxy:80/tracking
      TRACKING_PUBLIC_WEBSITE_URL: ""
      REDIS_URL: redis://redis:6379/1
      OLLAMA_LOCAL_URL: http://100.106.19.30:11434
      OLLAMA_BILL_VISION_MODEL: qwen2.5vl:32b
      ADMIN_RESTART_SECRET: ${ADMIN_RESTART_SECRET:-synerex-admin-restart-secret}
      RESTART_VIA_EXIT: "1"
      # Platform-level SMTP — used when Synerex Admin sends emails (e.g. invite links).
      # OEM Admins override this with their own SMTP via the Branding Settings page.
      # Fill in with a real SMTP provider before going to production.
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@synerexlabs.com}
      EMAIL_HOST: http://100.91.109.59:8080/tracking
    depends_on:
      mysql-tracking:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./tracking-program/8087/.tmp:/app/8087/.tmp
      - ./tracking-program/8087/assets/images:/app/8087/.tmp/public/images:ro
      - ./tracking-program/8087/flask_app/app:/app/8087-flask/app:ro
    ports:
      - "8087:8087"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8087/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
  tracking-rollup:
    image: synerex-platform_tracking:latest
    build:
      context: ./tracking-program
      dockerfile: 8087/flask_app/Dockerfile
    env_file:
      - ./tracking-program/8087/flask_app/.env.docker
    environment:
      TRACKING_DB_URL: mysql://tracking_user:TrackingPass123@mysql-tracking:3306/tracking
      PORT: "1339"
    depends_on:
      mysql-tracking:
        condition: service_healthy
    command: ["python", "/app/8087-rollup/run.py"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:1339/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
  tracking-errands:
    image: synerex-platform_tracking:latest
    build:
      context: ./tracking-program
      dockerfile: 8087/flask_app/Dockerfile
    env_file:
      - ./tracking-program/8087/flask_app/.env.docker
    environment:
      TRACKING_DB_URL: mysql://tracking_user:TrackingPass123@mysql-tracking:3306/tracking
      PORT: "1340"
    depends_on:
      mysql-tracking:
        condition: service_healthy
    command: ["python", "/app/8087-errands/run.py"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:1340/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
  tracking-cron:
    image: alpine:3.19
    depends_on:
      - tracking-errands
    command: >
      sh -c "while true; do sleep 300; wget -qO- --post-data= http://tracking-errands:1340/check-alerts 2>/dev/null || true; done"
    restart: unless-stopped
  website-backend:
    build:
      context: ./website/backend
    env_file:
      - ./website/backend/.env
    environment:
      PORT: "3001"
      NODE_ENV: production
      FRONTEND_URL: "http://100.91.109.59:8080,http://100.91.109.59:5173,http://100.91.109.59:8443"
    ports:
      - "3001:3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
  website:
    build:
      context: ./website
    env_file:
      - ./website/.env
    ports:
      - "5173:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
  chromadb:
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8100:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: licensing
      MYSQL_USER: license_user
      MYSQL_PASSWORD: LicensePass123
      MYSQL_ROOT_PASSWORD: rootpass123
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass123"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

  mysql-emv:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: emv
      MYSQL_USER: emv_user
      MYSQL_PASSWORD: EmvPass123
      MYSQL_ROOT_PASSWORD: rootpass123
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass123"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_emv_data:/var/lib/mysql

  mysql-tracking:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: tracking
      MYSQL_USER: tracking_user
      MYSQL_PASSWORD: TrackingPass123
      MYSQL_ROOT_PASSWORD: rootpass123
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass123"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_tracking_data:/var/lib/mysql

volumes:
  mysql_data:
  mysql_emv_data:
  mysql_tracking_data:
  chroma_data: