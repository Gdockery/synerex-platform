version: "3.9"

services:
  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      website:
        condition: service_healthy
      license-service:
        condition: service_healthy
      emv-program:
        condition: service_healthy
      tracking-program:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
  license-service:
    build:
      context: ./license-service/services/license-service
    env_file:
      - ./license-service/services/license-service/.env
    environment:
      TRACKING_PROGRAM_URL: http://tracking-program:8087
      ADMIN_RESTART_SECRET: ${ADMIN_RESTART_SECRET:-synerex-admin-restart-secret}
      RESTART_VIA_EXIT: "1"
    volumes:
      - ./license-service/templates:/app/templates:ro
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
  emv-program:
    build:
      context: ./emv-program/8082
    depends_on:
      mysql-emv:
        condition: service_healthy
    env_file:
      - ./emv-program/8082/.env
    environment:
      EMV_BASE_URL: http://localhost:8080/emv
      EMV_DB_HOST: mysql-emv
      EMV_DB_PORT: "3306"
      TRACKING_PROGRAM_URL: http://tracking-program:8087
      TRACKING_URL: http://tracking-program:8087
      EMV_API_KEY: ${EMV_API_KEY:-tracking-push-secret}
      WEATHER_SERVICE_URL: http://host.docker.internal:8200
      HTML_REPORT_URL: http://host.docker.internal:8084
      ADMIN_RESTART_SECRET: ${ADMIN_RESTART_SECRET:-synerex-admin-restart-secret}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./emv-program/8082:/app
      - ./emv-program/8084:/app/8084
    ports:
      - "8082:8082"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
  service-manager:
    image: python:3.11-slim
    working_dir: /app
    network_mode: "host"
    env_file:
      - ./emv-program/8082/.env
    volumes:
      - ./emv-program:/app
    command: >
      sh -c "pip install --no-cache-dir -r /app/8082/requirements.txt &&
             python /app/service_manager_daemon.py"
    restart: unless-stopped
  tracking-program:
    image: synerex-platform_tracking:latest
    build:
      context: ./tracking-program
      dockerfile: 8087/flask_app/Dockerfile
    env_file:
      - ./tracking-program/8087/flask_app/.env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TRACKING_DB_URL: mysql://tracking_user:TrackingPass123@mysql-tracking:3306/tracking
      LICENSE_SERVICE_URL: http://license-service:8000
      TRACKING_BASE_URL: http://proxy:80/tracking
      TRACKING_PUBLIC_WEBSITE_URL: http://localhost:5173
      ADMIN_RESTART_SECRET: ${ADMIN_RESTART_SECRET:-synerex-admin-restart-secret}
      RESTART_VIA_EXIT: "1"
    depends_on:
      mysql-tracking:
        condition: service_healthy
    volumes:
      - ./tracking-program/8087/.tmp:/app/8087/.tmp
      - ./tracking-program/8087/assets/images:/app/8087/.tmp/public/images:ro
      - ./tracking-program/8087/flask_app/app:/app/8087-flask/app:ro
    ports:
      - "8087:8087"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8087/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
  tracking-rollup:
    image: synerex-platform_tracking:latest
    build:
      context: ./tracking-program
      dockerfile: 8087/flask_app/Dockerfile
    env_file:
      - ./tracking-program/8087/flask_app/.env.docker
    environment:
      TRACKING_DB_URL: mysql://tracking_user:TrackingPass123@mysql-tracking:3306/tracking
      PORT: "1339"
    depends_on:
      mysql-tracking:
        condition: service_healthy
    command: ["python", "/app/8087-rollup/run.py"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:1339/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
  tracking-errands:
    image: synerex-platform_tracking:latest
    build:
      context: ./tracking-program
      dockerfile: 8087/flask_app/Dockerfile
    env_file:
      - ./tracking-program/8087/flask_app/.env.docker
    environment:
      TRACKING_DB_URL: mysql://tracking_user:TrackingPass123@mysql-tracking:3306/tracking
      PORT: "1340"
    depends_on:
      mysql-tracking:
        condition: service_healthy
    command: ["python", "/app/8087-errands/run.py"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:1340/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
  tracking-cron:
    image: alpine:3.19
    depends_on:
      - tracking-errands
    command: >
      sh -c "while true; do sleep 300; wget -qO- --post-data= http://tracking-errands:1340/check-alerts 2>/dev/null || true; done"
    restart: unless-stopped
  website:
    build:
      context: ./website
    env_file:
      - ./website/.env
    ports:
      - "5173:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: licensing
      MYSQL_USER: license_user
      MYSQL_PASSWORD: LicensePass123
      MYSQL_ROOT_PASSWORD: rootpass123
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass123"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

  mysql-emv:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: emv
      MYSQL_USER: emv_user
      MYSQL_PASSWORD: EmvPass123
      MYSQL_ROOT_PASSWORD: rootpass123
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass123"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_emv_data:/var/lib/mysql

  mysql-tracking:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: tracking
      MYSQL_USER: tracking_user
      MYSQL_PASSWORD: TrackingPass123
      MYSQL_ROOT_PASSWORD: rootpass123
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass123"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_tracking_data:/var/lib/mysql

volumes:
  mysql_data:
  mysql_emv_data:
  mysql_tracking_data:
  mysql_tracking_data: