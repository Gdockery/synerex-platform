version: "3.9"

networks:
  synerex:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1

services:
  proxy:
    image: nginx:1.27-alpine
    networks:
      synerex:
        ipv4_address: 172.18.1.16
    extra_hosts:
      - 'website:172.18.1.10'
      - 'website-backend:172.18.1.11'
      - 'license-service:172.18.1.12'
      - 'emv-program:172.18.1.13'
      - 'tracking-program:172.18.1.14'
      - 'html-report-service:172.18.1.15'
      - 'redis:172.18.0.3'
      - 'chromadb:172.18.0.2'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      website:
        condition: service_healthy
      website-backend:
        condition: service_healthy
      license-service:
        condition: service_healthy
      emv-program:
        condition: service_healthy
      tracking-program:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  license-service:
    build:
      context: ./license-service/services/license-service
    networks:
      synerex:
        ipv4_address: 172.18.1.12
    extra_hosts:
      - 'mysql:172.18.0.4'
      - 'redis:172.18.0.3'
      - 'tracking-program:172.18.1.14'
      - 'emv-program:172.18.1.13'
    env_file:
      - ./license-service/services/license-service/.env
    environment:
      TRACKING_PROGRAM_URL: http://tracking-program:8087
      REDIS_URL: redis://redis:6379/0
      ADMIN_RESTART_SECRET: ${ADMIN_RESTART_SECRET:-synerex-admin-restart-secret}
      RESTART_VIA_EXIT: "1"
    volumes:
      - ./license-service/templates:/app/templates:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  emv-program:
    build:
      context: ./emv-program/8082
    networks:
      synerex:
        ipv4_address: 172.18.1.13
    extra_hosts:
      - 'mysql-emv:172.18.0.5'
      - 'tracking-program:172.18.1.14'
      - 'license-service:172.18.1.12'
      - 'html-report-service:172.18.1.15'
      - 'host.docker.internal:host-gateway'
    depends_on:
      mysql-emv:
        condition: service_healthy
    env_file:
      - ./emv-program/8082/.env
    environment:
      EMV_BASE_URL: https://synerexlabs.com/emv
      WEBSITE_URL: https://synerexlabs.com
      EMV_DB_HOST: mysql-emv
      EMV_DB_PORT: "3306"
      TRACKING_PROGRAM_URL: http://tracking-program:8087
      TRACKING_URL: http://tracking-program:8087
      EMV_API_KEY: ${EMV_API_KEY:-tracking-push-secret}
      WEATHER_SERVICE_URL: http://host.docker.internal:8200
      HTML_REPORT_URL: http://html-report-service:8084
      ADMIN_RESTART_SECRET: ${ADMIN_RESTART_SECRET:-synerex-admin-restart-secret}
    volumes:
      - ./emv-program/8082:/app
      - ./emv-program/8084:/app/8084
    ports:
      - "8082:8082"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  html-report-service:
    build:
      context: ./emv-program/8084
    networks:
      synerex:
        ipv4_address: 172.18.1.15
    extra_hosts:
      - 'emv-program:172.18.1.13'
    working_dir: /app/8084
    env_file:
      - ./emv-program/8082/.env
    environment:
      EMV_BASE_URL: http://emv-program:8082
      EMV_APP_URL: http://emv-program:8082
    volumes:
      - ./emv-program/8082:/app
      - ./emv-program/8084:/app/8084
    ports:
      - "8084:8084"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8084/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 5

  service-manager:
    image: python:3.11-slim
    working_dir: /app
    network_mode: "host"
    pid: "host"
    cap_add:
      - SYS_PTRACE
      - DAC_READ_SEARCH
    env_file:
      - ./emv-program/8082/.env
    environment:
      CHROMA_URL: http://localhost:8100
      OLLAMA_EMBED_MODEL: nomic-embed-text
    volumes:
      - ./emv-program:/app
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      sh -c "pip install --no-cache-dir -r /app/8082/requirements.txt &&
             apt-get update -qq && apt-get install -y -qq docker.io &&
             (python /app/8082/ollama_ai_backend.py &) &&
             python -u /app/service_manager_daemon.py"
    restart: unless-stopped

  tracking-program:
    image: synerex-platform_tracking:latest
    build:
      context: ./tracking-program
      dockerfile: 8087/flask_app/Dockerfile
    networks:
      synerex:
        ipv4_address: 172.18.1.14
    extra_hosts:
      - 'mysql-tracking:172.18.0.6'
      - 'redis:172.18.0.3'
      - 'license-service:172.18.1.12'
      - 'proxy:172.18.1.16'
      - 'host.docker.internal:host-gateway'
    env_file:
      - ./tracking-program/8087/flask_app/.env.docker
    environment:
      TRACKING_DB_URL: mysql+pymysql://tracking_user:TrackingPass123@mysql-tracking:3306/tracking
      PDF_BRIDGE_PATH: /app/8087/scripts/pdf-bridge.js
      LICENSE_SERVICE_URL: http://license-service:8000
      LICENSE_SERVICE_PUBLIC_URL: https://tracking.synerexlabs.com/license
      TRACKING_BASE_URL: http://proxy:80/tracking
      TRACKING_PUBLIC_WEBSITE_URL: ""
      REDIS_URL: redis://redis:6379/1
      OLLAMA_LOCAL_URL: http://100.106.19.30:11434
      OLLAMA_BILL_VISION_MODEL: qwen2.5vl:32b
      BILL_PLATFORM_URL: http://100.106.19.30:8000
      BILL_PLATFORM_TIMEOUT: "1200"
      ADMIN_RESTART_SECRET: ${ADMIN_RESTART_SECRET:-synerex-admin-restart-secret}
      RESTART_VIA_EXIT: "1"
      EMAIL_HOST: https://tracking.synerexlabs.com
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-synerex-internal-2026}
    depends_on:
      mysql-tracking:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./tracking-program/8087/.tmp:/app/8087/.tmp
      - ./tracking-program/8087/assets/images:/app/8087/.tmp/public/images:ro
      - ./tracking-program/8087/flask_app/app:/app/8087-flask/app:ro
      - ./tracking-program/8087/storage/oem_logo:/app/8087/assets/images/oem_logo
      - ./tracking-program/8087/storage/client_company_logo:/app/8087/assets/images/client_company_logo
      - ./tracking-program/8087/storage/company_logo:/app/8087/assets/images/company_logo
    ports:
      - "8087:8087"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8087/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  tracking-rollup:
    image: synerex-platform_tracking:latest
    build:
      context: ./tracking-program
      dockerfile: 8087/flask_app/Dockerfile
    networks:
      synerex:
        ipv4_address: 172.18.1.17
    extra_hosts:
      - 'mysql-tracking:172.18.0.6'
      - 'redis:172.18.0.3'
    env_file:
      - ./tracking-program/8087/flask_app/.env.docker
    environment:
      TRACKING_DB_URL: mysql+pymysql://tracking_user:TrackingPass123@mysql-tracking:3306/tracking
      PORT: "1339"
    depends_on:
      mysql-tracking:
        condition: service_healthy
    command: ["python", "/app/8087-rollup/run.py"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:1339/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  tracking-errands:
    image: synerex-platform_tracking:latest
    build:
      context: ./tracking-program
      dockerfile: 8087/flask_app/Dockerfile
    networks:
      synerex:
        ipv4_address: 172.18.1.18
    extra_hosts:
      - 'mysql-tracking:172.18.0.6'
      - 'redis:172.18.0.3'
    env_file:
      - ./tracking-program/8087/flask_app/.env.docker
    environment:
      TRACKING_DB_URL: mysql+pymysql://tracking_user:TrackingPass123@mysql-tracking:3306/tracking
      PORT: "1340"
    depends_on:
      mysql-tracking:
        condition: service_healthy
    command: ["python", "/app/8087-errands/run.py"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:1340/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  tracking-cron:
    image: alpine:3.19
    networks:
      synerex:
        ipv4_address: 172.18.1.19
    extra_hosts:
      - 'tracking-errands:172.18.1.18'
    depends_on:
      - tracking-errands
    command: >
      sh -c "while true; do sleep 60; wget -qO- --post-data= http://tracking-errands:1340/check-alerts 2>/dev/null || true; wget -qO- --post-data= http://tracking-errands:1340/sync-data 2>/dev/null || true; done"
    restart: unless-stopped

  website-backend:
    build:
      context: ./website/backend
    networks:
      synerex:
        ipv4_address: 172.18.1.11
    env_file:
      - ./website/backend/.env
    environment:
      PORT: "3001"
      NODE_ENV: production
      FRONTEND_URL: "https://harmoniq.synerexlabs.com,https://tracking.synerexlabs.com,https://ucep.synerexlabs.com,https://portal.xecoenergy.com,https://pioneer.xecoenergy.com,https://ucep.xecoenergy.com,https://synerexlabs.com"
    ports:
      - "3001:3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  website:
    build:
      context: ./website
    networks:
      synerex:
        ipv4_address: 172.18.1.10
    env_file:
      - ./website/.env
    ports:
      - "5173:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  chromadb:
    image: chromadb/chroma:latest
    networks:
      synerex:
        ipv4_address: 172.18.0.2
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8100:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    networks:
      synerex:
        ipv4_address: 172.18.0.3
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  mysql:
    image: mysql:8.0
    networks:
      synerex:
        ipv4_address: 172.18.0.4
    environment:
      MYSQL_DATABASE: licensing
      MYSQL_USER: license_user
      MYSQL_PASSWORD: LicensePass123
      MYSQL_ROOT_PASSWORD: rootpass123
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass123"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

  mysql-emv:
    image: mysql:8.0
    networks:
      synerex:
        ipv4_address: 172.18.0.5
    environment:
      MYSQL_DATABASE: emv
      MYSQL_USER: emv_user
      MYSQL_PASSWORD: EmvPass123
      MYSQL_ROOT_PASSWORD: rootpass123
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass123"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_emv_data:/var/lib/mysql

  mysql-tracking:
    image: mysql:8.0
    networks:
      synerex:
        ipv4_address: 172.18.0.6
    environment:
      MYSQL_DATABASE: tracking
      MYSQL_USER: tracking_user
      MYSQL_PASSWORD: TrackingPass123
      MYSQL_ROOT_PASSWORD: rootpass123
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass123"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_tracking_data:/var/lib/mysql

  xeco-deploy:
    build:
      context: ../xeco_deployment_scanner
      dockerfile: Dockerfile
    networks:
      synerex:
        ipv4_address: 172.18.1.21
    ports:
      - "8092:8092"
    environment:
      DB_HOST: 172.18.0.8
      DB_PORT: 3306
      DB_NAME: deploy
      DB_USER: deploy_user
      DB_PASS: DeployPass123
      PHOTO_PATH: /data/photos
      TOKEN_TTL_DAYS: 30
      TRACKING_URL: http://172.18.1.10:8087
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-synerex-internal-2026}
    volumes:
      - xeco_deploy_data:/data
    restart: unless-stopped
    depends_on:
      mysql-deploy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8092/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  mysql-deploy:
    image: mysql:8.0
    networks:
      synerex:
        ipv4_address: 172.18.0.8
    environment:
      MYSQL_DATABASE: deploy
      MYSQL_USER: deploy_user
      MYSQL_PASSWORD: DeployPass123
      MYSQL_ROOT_PASSWORD: rootpass123
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass123"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_deploy_data:/var/lib/mysql

  xeco-inventory:
    build:
      context: ../xeco_inventory_refactored
      dockerfile: Dockerfile
    networks:
      synerex:
        ipv4_address: 172.18.1.20
    ports:
      - "8091:8091"
    environment:
      DB_PATH: /data/xeco.db
      STORAGE_PATH: /data/storage
      SECRET_KEY: xeco-inventory-secret-2024
      SEED_USERS: "landon.dockery@xecoenergy.com:Amarillo12!"
    volumes:
      - xeco_inventory_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8091/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
  mysql_emv_data:
  mysql_tracking_data:
  chroma_data:
  xeco_inventory_data:
  xeco_deploy_data:
  mysql_deploy_data:
