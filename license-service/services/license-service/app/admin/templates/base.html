<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin — Synerex License Service</title>
    <style>
      *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

      :root {
        --bg-base:    #030712;
        --bg-dark:    #111827;
        --bg-card:    #1f2937;
        --bg-card2:   #374151;
        --border:     #374151;
        --border-lt:  #4b5563;
        --text-base:  #f3f4f6;
        --text-muted: #d1d5db;
        --text-dim:   #9ca3af;
        --text-faint: #6b7280;
        --purple-hi:  #ddd6fe;
        --purple-mid: #a855f7;
        --purple-dark:#7c3aed;
        --blue-mid:   #2563eb;
        --blue-hi:    #60a5fa;
        --green-mid:  #16a34a;
        --red-mid:    #dc2626;
        --yellow-mid: #d97706;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: var(--bg-base);
        color: var(--text-base);
        line-height: 1.6;
      }

      /* Header */
      .header {
        background: linear-gradient(135deg, #111827 0%, #1e1b4b 60%, #111827 100%);
        border-bottom: 1px solid var(--purple-dark);
        padding: 1rem 2rem;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 2px 24px rgba(124,58,237,0.18);
      }
      .header-content {
        max-width: 1400px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
      }
      .logo-container a {
        display: flex;
        align-items: center;
        text-decoration: none;
        color: inherit;
      }
      .logo-container img {
        height: 72px;
        max-width: 320px;
        filter: brightness(0) invert(1);
      }
      .logo-text-replacement {
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--purple-hi);
        display: none;
      }
      .header-badge {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        background: rgba(124,58,237,0.3);
        color: var(--purple-hi);
        border: 1px solid var(--purple-dark);
        border-radius: 4px;
        padding: 2px 8px;
        margin-left: 0.75rem;
        white-space: nowrap;
      }
      .user-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      /* Nav */
      .nav-container {
        background: var(--bg-dark);
        border-bottom: 1px solid var(--border);
      }
      nav {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 2rem;
        display: flex;
        gap: 0;
        flex-wrap: wrap;
      }
      nav a {
        display: inline-block;
        padding: 0.85rem 1.1rem;
        color: var(--text-dim);
        text-decoration: none;
        font-weight: 500;
        font-size: 0.875rem;
        border-bottom: 3px solid transparent;
        white-space: nowrap;
        transition: color 0.15s, border-color 0.15s;
      }
      nav a:hover {
        color: var(--purple-hi);
        border-bottom-color: var(--purple-mid);
        text-decoration: none;
      }

      /* Container */
      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 2rem;
      }

      /* Buttons */
      .btn {
        display: inline-block;
        padding: 0.55rem 1.1rem;
        background: var(--purple-dark);
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
        text-decoration: none;
        line-height: 1.4;
      }
      .btn:hover {
        background: var(--purple-mid);
        transform: translateY(-1px);
        box-shadow: 0 4px 14px rgba(124,58,237,0.35);
        color: #fff;
        text-decoration: none;
      }
      .btn-secondary {
        background: var(--bg-card);
        color: var(--text-muted);
        border: 1px solid var(--border);
      }
      .btn-secondary:hover {
        background: var(--bg-card2);
        color: var(--text-base);
        box-shadow: none;
        transform: none;
      }
      .btn-danger { background: var(--red-mid); }
      .btn-danger:hover { background: #b91c1c; box-shadow: 0 4px 14px rgba(220,38,38,0.3); }
      .btn-success, .btn-green { background: var(--green-mid); }
      .btn-success:hover, .btn-green:hover { background: #15803d; box-shadow: 0 4px 14px rgba(22,163,74,0.3); }
      .btn-blue { background: var(--blue-mid); }
      .btn-blue:hover { background: #1d4ed8; box-shadow: 0 4px 14px rgba(37,99,235,0.3); }
      .btn-small, .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.8rem; }

      /* Cards */
      .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }
      .card h3 {
        margin: 0 0 1.25rem 0;
        color: var(--purple-hi);
        font-size: 1.15rem;
        font-weight: 600;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid var(--border);
      }

      /* Tables */
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        margin-top: 1.25rem;
      }
      th {
        background: var(--bg-dark);
        padding: 0.875rem 1rem;
        text-align: left;
        font-weight: 600;
        color: var(--text-dim);
        font-size: 0.775rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        border-bottom: 1px solid var(--border);
      }
      td {
        padding: 0.875rem 1rem;
        border-bottom: 1px solid var(--border);
        color: var(--text-muted);
        font-size: 0.9rem;
      }
      tr:hover td { background: rgba(124,58,237,0.06); }
      tr:last-child td { border-bottom: none; }

      /* Forms */
      .form-group { margin-bottom: 1.25rem; }
      label {
        display: block;
        margin-bottom: 0.4rem;
        font-weight: 500;
        color: var(--text-muted);
        font-size: 0.875rem;
      }
      input[type="text"],
      input[type="email"],
      input[type="password"],
      input[type="number"],
      input[type="date"],
      select,
      textarea {
        width: 100%;
        padding: 0.65rem 0.875rem;
        background: var(--bg-dark);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 0.875rem;
        color: var(--text-base);
        font-family: inherit;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      input::placeholder, textarea::placeholder { color: var(--text-faint); }
      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--purple-mid);
        box-shadow: 0 0 0 3px rgba(168,85,247,0.15);
      }
      select option { background: var(--bg-card); color: var(--text-base); }

      /* Alerts */
      .error {
        background: rgba(220,38,38,0.12);
        color: #fca5a5;
        padding: 0.875rem 1rem;
        border-radius: 7px;
        margin-bottom: 1.25rem;
        border-left: 4px solid var(--red-mid);
        font-size: 0.9rem;
      }
      .ok, .success {
        background: rgba(22,163,74,0.12);
        color: #86efac;
        padding: 0.875rem 1rem;
        border-radius: 7px;
        margin-bottom: 1.25rem;
        border-left: 4px solid var(--green-mid);
        font-size: 0.9rem;
      }
      .warning {
        background: rgba(217,119,6,0.12);
        color: #fcd34d;
        padding: 0.875rem 1rem;
        border-radius: 7px;
        margin-bottom: 1.25rem;
        border-left: 4px solid var(--yellow-mid);
        font-size: 0.9rem;
      }

      /* Badges */
      .badge {
        display: inline-block;
        padding: 0.2rem 0.6rem;
        border-radius: 99px;
        font-size: 0.72rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .badge-success { background: rgba(22,163,74,0.2); color: #86efac; border: 1px solid rgba(22,163,74,0.35); }
      .badge-danger  { background: rgba(220,38,38,0.2); color: #fca5a5; border: 1px solid rgba(220,38,38,0.35); }
      .badge-info    { background: rgba(37,99,235,0.2); color: #93c5fd; border: 1px solid rgba(37,99,235,0.35); }
      .badge-warning { background: rgba(217,119,6,0.2); color: #fcd34d; border: 1px solid rgba(217,119,6,0.35); }
      .badge-purple  { background: rgba(124,58,237,0.25); color: var(--purple-hi); border: 1px solid rgba(124,58,237,0.4); }

      /* Pre */
      pre {
        background: var(--bg-base);
        color: #e2e8f0;
        padding: 1.1rem;
        border-radius: 7px;
        border: 1px solid var(--border);
        overflow-x: auto;
        font-size: 0.82rem;
        line-height: 1.65;
        margin: 1rem 0;
      }

      /* Helpers */
      .small { font-size: 0.82rem; color: var(--text-dim); margin-top: 0.4rem; }
      .row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1.25rem;
        margin-bottom: 1.25rem;
      }
      a { color: var(--purple-hi); text-decoration: none; }
      a:hover { color: var(--purple-mid); text-decoration: underline; }
      hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }

      @media (max-width: 768px) {
        .container { padding: 1rem; }
        nav { padding: 0 1rem; }
        nav a { padding: 0.65rem 0.75rem; font-size: 0.82rem; }
        .header { padding: 0.875rem 1rem; }
        .row { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-content">
        <div class="logo-container">
          <a href="{{ admin_url('') }}">
            <img src="{{ admin_base }}/static/synerex_logo_color.png" alt="Synerex"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
            <span class="logo-text-replacement">Synerex</span>
            <span class="header-badge">Admin</span>
          </a>
        </div>
        <div class="user-actions">
          <a href="/admin" class="btn btn-secondary btn-small">&#8592; Synerex Admin</a>
          <form method="post" action="{{ admin_url('logout') }}" style="display:inline;">
            <button type="submit" class="btn btn-secondary btn-small">Logout</button>
          </form>
        </div>
      </div>
    </div>

    <div class="nav-container">
      <nav>
        <a href="{{ admin_url('') }}">Dashboard</a>
        <a href="{{ admin_url('orgs') }}">Organizations</a>
        <a href="{{ admin_url('users') }}">Users</a>
        <a href="{{ admin_url('oem-approvals') }}">OEM Approvals</a>
        <a href="{{ admin_url('pe-registrations') }}">PE Registrations</a>
        <a href="{{ admin_url('api-keys') }}">API Keys</a>
        <a href="{{ admin_url('templates') }}">Software Versions</a>
        <a href="{{ admin_url('authorizations') }}">Authorizations</a>
        <a href="{{ admin_url('licenses') }}">Licenses</a>
        <a href="{{ admin_url('server') }}">Server</a>
        <a href="{{ admin_base ~ '/docs' }}">API Docs</a>
      </nav>
    </div>

    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
