# CORS: allow AdminDashboard at localhost:5173 to fetch health checks
map $http_origin $cors_allow_origin {
  "http://localhost:5173" "http://localhost:5173";
  "http://127.0.0.1:5173" "http://127.0.0.1:5173";
  default "";
}

server {
  listen 80;

  # Use Docker's internal DNS resolver. Variables in proxy_pass force re-resolution
  # every valid= interval, so stale IPs after container rebuilds are never an issue.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    set $upstream http://website:80;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Access-Control-Allow-Origin $cors_allow_origin always;
  }

  location /license/ {
    # Handle CORS preflight without hitting the backend
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $cors_allow_origin;
      add_header Access-Control-Allow-Credentials "true";
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH";
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, Cookie";
      add_header Access-Control-Max-Age 86400;
      return 204;
    }

    set $upstream http://license-service:8000;
    rewrite ^/license/(.*) /$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin $http_origin;

    # Suppress backend CORS headers — nginx owns them to avoid duplicates
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;

    add_header Access-Control-Allow-Origin $cors_allow_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
  }

  location /emv/ {
    set $upstream http://emv-program:8082;
    rewrite ^/emv/(.*) /$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
  }

  location /tracking/ {
    set $upstream http://tracking-program:8087;
    rewrite ^/tracking/(.*) /$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Fonts from tracking app (CSS uses /fonts/... which resolves to origin root)
  location /fonts/ {
    set $upstream http://tracking-program:8087;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=86400";
    add_header Access-Control-Allow-Origin "*";
    types { font/woff2 woff2; font/woff woff; font/ttf ttf; application/vnd.ms-fontobject eot; image/svg+xml svg; }
  }

  # Static assets from tracking SPA (Angular uses root-relative paths for /js/, /css/, etc.)
  location /js/ {
    set $upstream http://tracking-program:8087;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=3600";
  }

  location /css/ {
    set $upstream http://tracking-program:8087;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=3600";
  }

  location /scripts/ {
    set $upstream http://tracking-program:8087;
    proxy_pass $upstream;
    proxy_set_header Host $host;
  }

  location /videos/ {
    proxy_pass http://192.168.1.14:8300;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=604800";
  }
}

server {
  listen 443 ssl;

  resolver 127.0.0.11 valid=10s ipv6=off;

  # TLS placeholder paths (mount certs in /etc/nginx/certs)
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  location / {
    set $upstream http://website:80;
    proxy_pass $upstream;
