# CORS: allow AdminDashboard at localhost:5173 to fetch health checks
map $http_origin $cors_allow_origin {
  "http://localhost:5173" "http://localhost:5173";
  "http://127.0.0.1:5173" "http://127.0.0.1:5173";
  default "";
}

server {
  listen 80;

  # /admin → React AdminDashboard (website SPA); license admin at /license/admin

  location / {
    proxy_pass http://website:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Access-Control-Allow-Origin $cors_allow_origin always;
  }

  location /license/ {
    proxy_pass http://license-service:8000/;
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin $cors_allow_origin always;
  }

  location /emv/ {
    proxy_pass http://emv-program:8082/;
    proxy_set_header Host $host;
  }

  location /tracking/ {
    proxy_pass http://tracking-program:8087/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Fonts from tracking app (CSS uses /fonts/... which resolves to origin root)
  location /fonts/ {
    proxy_pass http://tracking-program:8087/fonts/;
    proxy_set_header Host $host;
  }
}

server {
  listen 443 ssl;

  # TLS placeholder paths (mount certs in /etc/nginx/certs)
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  # /admin → React AdminDashboard (website SPA); license admin at /license/admin

  location / {
    proxy_pass http://website:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Access-Control-Allow-Origin $cors_allow_origin always;
  }

  location /license/ {
    proxy_pass http://license-service:8000/;
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin $cors_allow_origin always;
  }

  location /emv/ {
    proxy_pass http://emv-program:8082/;
    proxy_set_header Host $host;
  }

  location /tracking/ {
    proxy_pass http://tracking-program:8087/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Fonts from tracking app (CSS uses /fonts/... which resolves to origin root)
  location /fonts/ {
    proxy_pass http://tracking-program:8087/fonts/;
    proxy_set_header Host $host;
  }
}
