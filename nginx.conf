# CORS: allow known origins for the server IP and HTTPS
map $http_origin $cors_allow_origin {
  "https://harmoniq.synerexlabs.com"   "https://harmoniq.synerexlabs.com";
  "https://tracking.synerexlabs.com"   "https://tracking.synerexlabs.com";
  "https://ucep.synerexlabs.com"       "https://ucep.synerexlabs.com";
  "https://portal.xecoenergy.com"      "https://portal.xecoenergy.com";
  "https://pioneer.xecoenergy.com"     "https://pioneer.xecoenergy.com";
  "https://ucep.xecoenergy.com"        "https://ucep.xecoenergy.com";
  default "";
}

server {
  listen 80;

  # Docker embedded DNS (required so upstream hostnames resolve; 8.8.8.8 cannot resolve service names)
  resolver 127.0.0.11 valid=10s ipv6=off;

  # ECBS OS approved-stack frontend (Next.js)
  location ^~ /_next/ {
    set $upstream http://ecbs-os-frontend:3001;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
  }

  location ^~ /enterprise/ {
    set $upstream http://ecbs-os-frontend:3001;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
  }

  location ^~ /data-analytics/ {
    set $upstream http://ecbs-os-frontend:3001;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
  }

  # Website backend API (contact form, DocuSign NDA, PDF generation)
  # Tracking project API — routed directly to tracking-program (not website-backend)
  location ^~ /api/project/ {
    client_max_body_size 10m;
    proxy_pass http://172.18.1.14:8087;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout 30s;
    add_header Access-Control-Allow-Origin $cors_allow_origin always;
  }

  location /api/ {
    set $upstream http://website-backend:3001;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    add_header Access-Control-Allow-Origin $cors_allow_origin always;
  }

  location / {
    set $upstream http://website:80;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Access-Control-Allow-Origin $cors_allow_origin always;
  }

  location /license/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $cors_allow_origin;
      add_header Access-Control-Allow-Credentials "true";
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH";
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, Cookie";
      add_header Access-Control-Max-Age 86400;
      return 204;
    }

    set $upstream http://license-service:8000;
    rewrite ^/license/(.*) /$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin $http_origin;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;

    add_header Access-Control-Allow-Origin $cors_allow_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
  }

  location /emv/static/ {
    set $upstream http://emv-program:8082;
    rewrite ^/emv/(.*) /$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # Redirect bare EMV app paths to the /emv/ prefix
  location ~ ^/(main-dashboard|admin-panel|logout|upload|analyze|results)(/.*)?$ {
    return 301 $scheme://$http_host/emv/$1$2$is_args$args;
  }

  # Explicit route for push-baseline (HTML Push to Tracking) - ensures correct proxy
  location = /emv/api/tracking/push-baseline {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $http_origin;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH";
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Session-Token, Cookie";
      add_header Access-Control-Allow-Credentials "true";
      add_header Access-Control-Max-Age 86400;
      return 204;
    }
    set $pb_upstream http://emv-program:8082;
    proxy_pass $pb_upstream/api/tracking/push-baseline;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Session-Token $http_x_session_token;
    proxy_set_header Cookie $http_cookie;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }
  location = /emv/api/tracking/push-baseline/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $http_origin;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH";
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Session-Token, Cookie";
      add_header Access-Control-Allow-Credentials "true";
      add_header Access-Control-Max-Age 86400;
      return 204;
    }
    set $pb_upstream http://emv-program:8082;
    proxy_pass $pb_upstream/api/tracking/push-baseline;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Session-Token $http_x_session_token;
    proxy_set_header Cookie $http_cookie;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }

  location /emv/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $http_origin;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH";
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Session-Token, Cookie";
      add_header Access-Control-Allow-Credentials "true";
      add_header Access-Control-Max-Age 86400;
      return 204;
    }
    client_max_body_size 50m;
    set $upstream http://emv-program:8082;
    rewrite ^/emv/(.*) /$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Session-Token $http_x_session_token;
    proxy_set_header Cookie $http_cookie;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }

  # Fallback: /api/tracking/* without /emv/ prefix (e.g. when base wrong) - proxy to EMV
  location /api/tracking/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $http_origin;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH";
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Session-Token, Cookie";
      add_header Access-Control-Allow-Credentials "true";
      add_header Access-Control-Max-Age 86400;
      return 204;
    }
    set $upstream http://emv-program:8082;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Session-Token $http_x_session_token;
    proxy_set_header Cookie $http_cookie;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }

  # Redirect bare EMV app paths to the /emv/ prefix (preserving host:port via $http_host)
  location ~ ^/(main-dashboard|admin-panel|logout|upload|analyze|results)(/.*)?$ {
    return 301 $scheme://$http_host/emv/$1$2$is_args$args;
  }

  # Health check endpoint for AdminDashboard (avoids CORS issues with 302 redirects)
  location = /tracking/health {
    add_header Content-Type "application/json" always;
    add_header Access-Control-Allow-Origin $cors_allow_origin always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    return 200 '{"status":"ok"}';
  }

  # Redirect bare chunk requests to correct /js/ path (handles content-hashed names like 0.f7d4aea6.chunk.js)
  location ~ ^/tracking/([0-9]+(?:\.[a-f0-9]+)?\.chunk\.js)$ {
    return 301 $scheme://$http_host/tracking/js/$1;
  }

  # VPN-only endpoint — block from public internet
  location /tracking/api/node-sync/ {
    return 403;
  }

  # Long-running AI bill scan endpoint — 600s timeout to allow vision model processing
  location ^~ /tracking/api/bill/ {
    client_max_body_size 50m;
    set $upstream http://tracking-program:8087;
    rewrite ^/tracking/(.*) /$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 30s;
    add_header Access-Control-Allow-Origin $cors_allow_origin always;
  }

  # Long-running AI SLD scan endpoint — 600s timeout to allow vision model processing
  location ^~ /tracking/api/sld/ {
    client_max_body_size 50m;
    set $upstream http://tracking-program:8087;
    rewrite ^/tracking/(.*) /$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 30s;
    add_header Access-Control-Allow-Origin $cors_allow_origin always;
  }


  # Project API — includes proposal PDF generation (WeasyPrint can take 30-60s)
  location ^~ /tracking/api/project/ {
    client_max_body_size 10m;
    rewrite ^/tracking/(.*) /$1 break;
    proxy_pass http://172.18.1.14:8087;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout 30s;
    add_header Access-Control-Allow-Origin $cors_allow_origin always;
  }
  # Tracking app images → upstream /images/* (Flask on :8087)
  # Note: use literal proxy_pass (not $upstream) — rewrite+break clears variables.
  location /tracking/tracking-images/ {
    rewrite ^/tracking/tracking-images/(.*)$ /images/$1 break;
    proxy_pass http://tracking-program:8087;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=86400";
  }

  location /tracking-images/ {
    rewrite ^/tracking-images/(.*)$ /images/$1 break;
    proxy_pass http://tracking-program:8087;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=86400";
  }

  # Marketing site public images → website container /images/*
  location /web-images/ {
    rewrite ^/web-images/(.*)$ /images/$1 break;
    proxy_pass http://website:80;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=86400";
  }

  # License service static files → /static/* on :8000
  location /license-images/ {
    rewrite ^/license-images/(.*)$ /static/$1 break;
    proxy_pass http://license-service:8000;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=86400";
  }

  # EMV static files → /static/* on :8082
  location /emv-images/ {
    rewrite ^/emv-images/(.*)$ /static/$1 break;
    proxy_pass http://emv-program:8082;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=86400";
  }

  location /tracking/ {
    set $upstream http://tracking-program:8087;
    rewrite ^/tracking/(.*) /$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Access-Control-Allow-Origin $cors_allow_origin always;
  }

  # Service Manager runs on host network - reach it via the Docker bridge gateway
  location /service-manager/ {
    rewrite ^/service-manager/(.*) /$1 break;
    proxy_pass http://172.18.0.1:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Access-Control-Allow-Origin $cors_allow_origin always;
  }

  # Fonts from tracking app
  location /fonts/ {
    set $upstream http://tracking-program:8087;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=86400";
    add_header Access-Control-Allow-Origin "*";
    types { font/woff2 woff2; font/woff woff; font/ttf ttf; application/vnd.ms-fontobject eot; image/svg+xml svg; }
  }

  # Static assets from tracking SPA
  location /js/ {
    set $upstream http://tracking-program:8087;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
  }

  location /css/ {
    set $upstream http://tracking-program:8087;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
  }

  location /scripts/ {
    set $upstream http://tracking-program:8087;
    proxy_pass $upstream;
    proxy_set_header Host $host;
  }

  location /videos/ {
    proxy_pass http://100.106.19.30:8300;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=604800";
  }
}

