server {
  listen 80;

  # /admin → React AdminDashboard (website SPA); license admin at /license/admin

  location / {
    proxy_pass http://website:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /license/ {
    proxy_pass http://license-service:8000/;
    proxy_set_header Host $host;
  }

  location /emv/ {
    proxy_pass http://emv-program:8082/;
    proxy_set_header Host $host;
  }

  location /tracking/ {
    proxy_pass http://tracking-program:8087/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl;

  # TLS placeholder paths (mount certs in /etc/nginx/certs)
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  # /admin → React AdminDashboard (website SPA); license admin at /license/admin

  location / {
    proxy_pass http://website:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /license/ {
    proxy_pass http://license-service:8000/;
    proxy_set_header Host $host;
  }

  location /emv/ {
    proxy_pass http://emv-program:8082/;
    proxy_set_header Host $host;
  }

  location /tracking/ {
    proxy_pass http://tracking-program:8087/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
